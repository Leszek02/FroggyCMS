    <link rel="stylesheet" href="/static/admin/style_sheets_css/style-preset.css" />

<style>
    body.pc-body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
    }

    .pc-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 260px;
        background: #2c3e50;
        z-index: 1025;
        overflow-y: auto;
    }

    .pc-container {
        width: 100%;
    }

    .pc-content {
        margin-left: 260px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px;
        box-sizing: border-box;
        width: calc(100% - 260px);
    }

    .page-wrapper {
        background: white;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 1200px;
        overflow: hidden;
    }

    .table-responsive {
        width: 100%;
        overflow-x: auto;
        margin-top: 20px;
        border: 1px solid #eee;
        border-radius: 4px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 900px;
    }

    th, td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
        white-space: nowrap;
    }

    th {
        background: #f8f9fa;
        font-weight: 600;
        color: #333;
    }

    tr:hover {
        background-color: #fcfcfc;
    }

    .edit-btn, .delete-btn {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 13px;
    }
    .edit-btn { background: #e936e9; color: white; margin-right: 5px; }
    .delete-btn { background: #e74c3c; color: white; }
</style>
</head>

    <nav class="pc-sidebar">
        <div class="navbar-wrapper">

                </a>
            </div>
            <div class="navbar-content">
                <ul class="pc-navbar">

                    <li class="pc-item">

                            <span class="pc-micon">
                                <i class="ph ph-house-line"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Administrator">Administrator</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/client" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-house-line"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Klient">Klient</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/navigation" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-house-line"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Nawigacja">Nawigacja</span>

                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/products" class="pc-link">
                            <span class="pc-micon">

                            </span>
                            <span class="pc-mtext" data-i18n="Produkty">Produkty</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/pages" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-truck"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Strony">Strony</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/order" class="pc-link">
                            <span class="pc-micon">

                            </span>
                            <span class="pc-mtext" data-i18n="Strony">Zamówienia</span>

                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/delivery_dictionary" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-truck"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Dostawcy">Dostawcy</span>

                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/payment_dictionary" class="pc-link">
                            <span class="pc-micon">

                </ul>
            </div>
        </div>
    </nav>

    <div class="pc-content">
        <div class="page-wrapper">

            <h1>Edit Delivery Dictionary</h1>

            <div class="table-responsive">
                <table border="1" cellpadding="8">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Delivery Method Name</th>
                            <th>Price (PLN)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="deliveryTableBody"></tbody>
                </table>
            </div>

            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <button id="addBtn"
                    style="background: #27ae60; color: white; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
                    + Add New Delivery Method
                </button>
            </div>

        </div>
    </div>

    <script>
        async function loadDeliveryDictionary() {
            try {
                const res = await fetch("/delivery_dictionary");
                if (!res.ok) {
                    throw new Error("Failed to load delivery methods");
                }

                const data = await res.json();
                const tbody = document.getElementById("deliveryTableBody");
                tbody.innerHTML = "";

                data.forEach(item => {
                    const tr = document.createElement("tr");

                    // Handling naming variations from Go API vs DB
                    const id = item.Delivery_dict_ID ?? item.delivery_dict_id;
                    const name = item.Name ?? item.name ?? "Unnamed";
                    const price = item.Price ?? item.price ?? 0;

                    tr.innerHTML = `
                        <td>${id}</td>
                        <td>${name}</td>
                        <td>${Number(price).toFixed(2)} PLN</td>
                        <td>
                            <button class="edit-btn" data-id="${id}">Edit</button>
                            <button class="delete-btn" data-id="${id}">Delete</button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                    // EDIT handler
                    tr.querySelector(".edit-btn").addEventListener("click", () => {
                        window.location.href = `/admin-static/edit?table=delivery_dictionary&id=${id}`;
                    });

                    // DELETE handler
                    tr.querySelector(".delete-btn").addEventListener("click", async () => {
                        if (!confirm("Are you sure you want to delete this delivery method?")) return;

                        try {
                            const resDel = await fetch(`/delivery_dictionary/${id}`, {
                                method: "DELETE",
                                headers: { "Content-Type": "application/json" }
                            });

                            if (!resDel.ok) {
                                const text = await resDel.text();
                                throw new Error(text);
                            }

                            tr.remove();

                        } catch (err) {
                            console.error("Delete failed:", err);
                            alert("Failed to delete delivery item");
                        }
                    });
                });

            } catch (err) {
                console.error("Delivery load error:", err);
                alert("Failed to load delivery dictionary");
            }
        }

        window.addEventListener("DOMContentLoaded", loadDeliveryDictionary);

        document.getElementById("addBtn").onclick = () => {
            // Correctly passing the table name so the dynamic form knows what to build
            window.location.href = "/admin-static/create?table=delivery_dictionary";
        };
    </script>

</body>

</html>
