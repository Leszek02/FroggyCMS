<style>
    body.pc-body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
    }

    .pc-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 260px;
        background: #2c3e50;
        z-index: 1025;
        overflow-y: auto;
    }

    .pc-container {
        width: 100%;
    }

    .pc-content {
        margin-left: 260px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px;
        box-sizing: border-box;
        width: calc(100% - 260px);
    }

    .page-wrapper {
        background: white;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 1200px;
        overflow: hidden;
    }

    .table-responsive {
        width: 100%;
        overflow-x: auto;
        margin-top: 20px;
        border: 1px solid #eee;
        border-radius: 4px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 900px;
    }

    th, td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
        white-space: nowrap;
    }

    th {
        background: #f8f9fa;
        font-weight: 600;
        color: #333;
    }

    tr:hover {
        background-color: #fcfcfc;
    }

    .edit-btn, .delete-btn {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 13px;
    }
    .edit-btn { background: #e936e9; color: white; margin-right: 5px; }
    .delete-btn { background: #e74c3c; color: white; }
</style>
</head>

    <div class="pc-content">
    <div class="page-wrapper">

        <h1>Edit Client</h1>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First name</th>
                        <th>Last name</th>
                        <th>Login</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Newsletter</th>
                        <th>Created</th>
                        <th>Modified</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody"></tbody>
            </table>
        </div>

    </div>
</div>

    <script>
    function formatDate(dateStr) {
        if (!dateStr) return "-";
        const date = new Date(dateStr);
        return isNaN(date.getTime()) ? dateStr : date.toLocaleString();
    }
        async function loadClient() {
            try {
                const res = await fetch("/client");
                if (!res.ok) {
                    throw new Error("Failed to load client");
                }

                const data = await res.json();
                const tbody = document.getElementById("clientTableBody");
                tbody.innerHTML = "";

                data.forEach(item => {
                    const tr = document.createElement("tr");
                    const id = item.Client_ID ?? item.client_ID;
                    const first_name = item.First_name ?? item.first_name ?? "Unnamed";
                    const last_name = item.Last_name ?? item.last_name ?? "Unnamed";
                    const login = item.Login ?? item.login ?? "Unnamed";
                    const email = item.Email ?? item.email ?? "Unnamed";
                    const phone = item.Phone ?? item.phone ?? "Unnamed";
                    const status = item.Status ?? item.status ?? false;
                    const newsletter = item.Newsletter ?? item.newsletter ?? false;

                    tr.innerHTML = `
                        <td>${id}</td>
                        <td>${first_name}</td>
                        <td>${last_name}</td>
                        <td>${login}</td>
                        <td>${email}</td>
                        <td>${phone}</td>
                        <td>${status}</td>
                        <td>${newsletter}</td>
                        <td>${formatDate(item.create_date)}</td>
                        <td>${formatDate(item.modify_date)}</td>
                        <td>
                            <button class="edit-btn" data-id="${id}">Edit</button>
                            <button class="delete-btn" data-id="${id}">Delete</button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                    tr.querySelector(".edit-btn").addEventListener("click", () => {
                        window.location.href = `/admin-static/edit?table=client&id=${id}`;
                    });

                    tr.querySelector(".delete-btn").addEventListener("click", async () => {
                        if (!confirm("Are you sure you want to delete this client?")) return;

                        try {
                            const resDel = await fetch(`/client/${id}`, {
                                method: "DELETE",
                                headers: { "Content-Type": "application/json" }
                            });

                            if (!resDel.ok) {
                                const text = await resDel.text();
                                throw new Error(text);
                            }

                            tr.remove();

                        } catch (err) {
                            console.error("Delete failed:", err);
                            alert("Failed to delete client");
                        }
                    });
                });

            } catch (err) {
                console.error("Client load error:", err);
                alert("Failed to load client");
            }
        }

        window.addEventListener("DOMContentLoaded", loadClient);

    </script>
