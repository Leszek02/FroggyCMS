<div class="pc-content">
    <div class="page-wrapper">
        <h1 id="formTitle">Edit Product Page</h1>

        <form id="productForm">
            <h2>Display Options</h2>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="Availability">
                    In stock
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="ShowType">
                    Show product type
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="AllowQuantity">
                    Allow quantity selection
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="ShowRelated">
                    Show related products
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="ShowReviews">
                    Show Reviews
                </label>
            </div>

            <button type="submit">Save Page</button>
        </form>

        <div id="formMessage"></div>
        <button id="backBtn" type="button" style="background:#7f8c8d;">← Back</button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const API = "/pages";
    const form = document.getElementById("productForm");
    const msg = document.getElementById("formMessage");

    let originalPage = null;

    document.getElementById("backBtn").onclick = () => {
        window.location.href = "/admin-static/pages.html";
    };

    async function loadPage() {
        const res = await fetch(`${API}/${id}`);
        originalPage = await res.json();

        let content = {};
        try {
            content = JSON.parse(originalPage.content || "{}");
        } catch {}

        // Populate form from content
        Object.keys(content).forEach(key => {
            const input = form.elements[key];
            if (!input) return;

            if (input.type === "checkbox") {
                input.checked = !!content[key];
            } else {
                input.value = content[key];
            }
        });
    }

    form.addEventListener("submit", async function (e) {
    console.log("Form submitted!");
    e.preventDefault();

    console.log("originalPage:", originalPage);
    
    if (!originalPage) {
        console.log("No originalPage - stopping");
        msg.textContent = "Error: Page data not loaded";
        return;
    }

    const contentPayload = {
        Availability: e.target.elements["Availability"].checked,
        ShowType: e.target.elements["ShowType"].checked,
        AllowQuantity: e.target.elements["AllowQuantity"].checked,
        ShowRelated: e.target.elements["ShowRelated"].checked,
        ShowReviews: e.target.elements["ShowReviews"].checked
    };

    console.log("Content payload:", contentPayload);

    const payload = {
        page_id: originalPage.page_id,
        name: originalPage.name,
        type: originalPage.type,
        status: originalPage.status,
        administrator_id: originalPage.administrator_id,
        content: JSON.stringify(contentPayload)
    };

    console.log("Sending payload:", payload);

    try {
        const res = await fetch(`/pages/${originalPage.page_id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        console.log("Response status:", res.status);

        if (res.ok) {
            window.location.href = "/admin-static/pages";
        } else {
            const errorText = await res.text();
            console.log("Error:", errorText);
            msg.textContent = errorText;
        }
    } catch (error) {
        console.error("Fetch error:", error);
        msg.textContent = "Network error: " + error.message;
    }
});

if (id) {
    console.log("Loading page with ID:", id);
    loadPage();
} else {
    console.log("No ID provided");
}

    if (id) loadPage();
</script>
