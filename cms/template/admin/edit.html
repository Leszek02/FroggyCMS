        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #formMessage {
            margin-top: 10px;
            color: red;
        }

    <div class="pc-content">
        <div class="page-wrapper">
            <h1 id="formTitle">Edit Record</h1>
            <form id="editorForm"></form>
            <div id="formMessage"></div>
            <button id="backBtn" type="button" style="background:#7f8c8d; margin-top:10px;">← Back</button>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const table = params.get("table");
    const id = params.get("id");

    const API = `/${table}`;
    const form = document.getElementById("editorForm");
    const msg = document.getElementById("formMessage");

    let currentSchema = [];
    let recordData = null;

    document.getElementById("backBtn").onclick = () => {
        window.location.href = `/admin-static/${table}`;
    };

    async function loadRecord() {
        const res = await fetch(`${API}/${id}`);
        const data = await res.json();
        recordData = Array.isArray(data) ? data[0] : data;
        console.log("Loaded record data:", recordData);
    }

    /**
     * Helper function to get the value from option object based on value_field
     */
    function getOptionValue(opt, col) {
        // If value_field is explicitly specified in schema, use it
        if (col.value_field) {
            const key = Object.keys(opt).find(k => 
                k.toLowerCase() === col.value_field.toLowerCase()
            );
            if (key) return opt[key];
        }
        
        // Otherwise, try to find an ID field (backwards compatible)
        return opt.id ?? 
               opt.ID ?? 
               opt[col.name + "_id"] ?? 
               Object.values(opt)[0];
    }

    /**
     * Helper function to get the label from option object
     */
    function getOptionLabel(opt, col) {
        if (col.label_field) {
            const key = Object.keys(opt).find(k => 
                k.toLowerCase() === col.label_field.toLowerCase()
            );
            if (key) return opt[key];
        }
        
        if (opt.label !== undefined) {
            return opt.label;
        }
        
        // Fallback to the value
        return getOptionValue(opt, col);
    }

    async function buildForm() {
        const res = await fetch(`${API}/schema`);
        currentSchema = await res.json();
        console.log("Schema:", currentSchema);
        form.innerHTML = "";

        for (const col of currentSchema) {
            if (!col.name) continue;
            if (["create_date", "modify_date"].includes(col.name)) continue;

            const label = document.createElement("label");
            label.textContent = col.name.replace(/_/g, " ").toUpperCase();
            form.appendChild(label);

            let input;

            // ---------- FILE ----------
            if (col.input === "file") {
                const container = document.createElement("div");
                container.className = "file-browser-group";
                
                // File Input (for new uploads)
                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.name = col.name;
                fileInput.id = `file_${col.name}`;
                fileInput.accept = "image/*";
                fileInput.style.marginBottom = "5px";
                
                // Hidden Input (to hold existing ID if chosen)
                const hiddenID = document.createElement("input");
                hiddenID.type = "hidden";
                hiddenID.name = `${col.name}_id`;
                hiddenID.id = `hidden_${col.name}`;

                // Browse Button
                const browseBtn = document.createElement("button");
                browseBtn.type = "button";
                browseBtn.textContent = "Browse Existing Photos";
                browseBtn.style = "font-size:12px; padding:5px 10px; background:#95a5a6; margin-top:0;";
                browseBtn.onclick = () => openMediaGallery(col.name);

                container.appendChild(fileInput);
                container.appendChild(browseBtn);
                container.appendChild(hiddenID);
                
                form.appendChild(container);
                
                // Show current file if exists - AFTER appending to form
                if (recordData && recordData[col.name]) {
                    updatePreview(col.name, recordData[col.name]);
                }
                
                input = null; // Prevent double appending
            }
            // ---------- SELECT ----------
            else if (col.input === "select") {
                input = document.createElement("select");
                input.name = col.name;
                if (col.required) input.required = true;

                try {
                    const optRes = await fetch(col.options_from);
                    const options = await optRes.json();
                    console.log(`Options for ${col.name}:`, options);

                    // Get the current value from record
                    const currentValue = recordData && recordData[col.name];
                    console.log(`Current value for ${col.name}:`, currentValue);

                    // Add empty option ONLY if field is not required
                    if (!col.required) {
                        const emptyOption = document.createElement("option");
                        emptyOption.value = "";
                        emptyOption.textContent = "-- Select --";
                        // Select the empty option if current value is null/undefined/empty
                        if (currentValue === null || currentValue === undefined || currentValue === "") {
                            emptyOption.selected = true;
                        }
                        input.appendChild(emptyOption);
                    }

                    options.forEach(opt => {
                        const option = document.createElement("option");

                        // VALUE: Use value_field if specified, otherwise try to find ID
                        const optionValue = getOptionValue(opt, col);
                        option.value = optionValue;

                        // LABEL: Use label_field if specified
                        option.textContent = getOptionLabel(opt, col);

                        // Check if this option should be selected
                        // Compare as strings to handle type mismatches
                        // Only select if we have a real current value (not null/undefined/empty)
                        if (currentValue != null && currentValue !== "" && String(optionValue) === String(currentValue)) {
                            option.selected = true;
                            console.log(`Selected option for ${col.name}:`, optionValue, option.textContent);
                        }

                        input.appendChild(option);
                    });

                    // Double-check: if nothing was selected but we have a value, try to set it
                    if (currentValue != null && input.value !== String(currentValue)) {
                        console.warn(`Could not find matching option for ${col.name}. Current value: ${currentValue}, Available values:`, 
                            Array.from(input.options).map(o => o.value));
                        // Try to set it anyway (in case of type conversion issues)
                        input.value = currentValue;
                    }

                } catch (error) {
                    console.error(`Error loading options for ${col.name}:`, error);
                    msg.textContent = `Error loading options for ${col.name}`;
                }

            // ---------- NON-SELECT ----------
            } else {
                input = document.createElement("input");
                input.name = col.name;

                if (col.type === "integer" || col.type === "numeric") {
                    input.type = "number";
                    input.step = "any";
                } else if (col.type === "boolean") {
                    input.type = "checkbox";
                } else {
                    input.type = "text";
                }

                if (recordData && recordData[col.name] != null) {
                    if (input.type === "checkbox") {
                        input.checked = !!recordData[col.name];
                    } else {
                        input.value = recordData[col.name];
                    }
                }
            }

            // Read-only IDs
            if (col.name.toLowerCase().endsWith("_id")) {
                input.readOnly = true;
                input.style.backgroundColor = "#f0f0f0";
            }

            if (input) {
                form.appendChild(input);
            }
        }

        const btn = document.createElement("button");
        btn.type = "submit";
        btn.textContent = "Save Changes";
        form.appendChild(btn);
    }

    form.onsubmit = async (e) => {
        e.preventDefault();
        const payload = {};
        const formData = new FormData(form);

        console.log("Form data entries:");
        for (let [key, value] of formData.entries()) {
            console.log(`  ${key}: ${value}`);
        }

        currentSchema.forEach(col => {
            if (["create_date", "modify_date"].includes(col.name)) return;
            if (col.name.toLowerCase().endsWith("_id") && col.input !== "select") return;

            const input = form.elements[col.name];
            if (!input) {
                console.log(`No input found for ${col.name}`);
                return;
            }

            if (col.type === "boolean") {
                payload[col.name] = input.checked;
            } else if (col.type === "integer") {
                const rawValue = formData.get(col.name);
                if (rawValue === "" || rawValue === null) {
                    payload[col.name] = null;
                } else {
                    const parsed = parseInt(rawValue, 10);
                    payload[col.name] = isNaN(parsed) ? null : parsed;
                }
            } else if (col.type === "numeric") {
                const rawValue = formData.get(col.name);
                if (rawValue === "" || rawValue === null) {
                    payload[col.name] = null;
                } else {
                    const parsed = parseFloat(rawValue);
                    payload[col.name] = isNaN(parsed) ? null : parsed;
                }
            } else if (col.input === "select") {
                const rawValue = formData.get(col.name);
                if (rawValue === "" || rawValue === null) {
                    payload[col.name] = null;
                } else if (col.type === "integer" || col.type === "numeric") {
                    const parsed = parseInt(rawValue, 10);
                    payload[col.name] = isNaN(parsed) ? rawValue : parsed;
                } else {
                    payload[col.name] = rawValue;
                }
            } else {
                const rawValue = formData.get(col.name);
                payload[col.name] = rawValue;
            }
        });

        console.log("Submitting payload:", payload);

        // Check if this form has file uploads
        const hasFileInput = currentSchema.some(col => col.input === "file");

        try {
            let res;
            
            if (hasFileInput) {
                // For forms with files, use multipart FormData
                const fileFormData = new FormData();
                
                // Add all fields from payload with proper type conversion
                for (let [key, value] of Object.entries(payload)) {
                    fileFormData.append(key, value);
                }
                
                // Add file inputs separately
                currentSchema.forEach(col => {
                    if (col.input === "file") {
                        const fileInput = document.getElementById(`file_${col.name}`);
                        const hiddenID = document.getElementById(`hidden_${col.name}`);
                        
                        if (fileInput && fileInput.files.length > 0) {
                            // New file uploaded
                            fileFormData.append(col.name, fileInput.files[0]);
                        } else if (hiddenID && hiddenID.value) {
                            // Existing file selected from gallery
                            fileFormData.append(`${col.name}_id`, hiddenID.value);
                        }
                    }
                });
                
                res = await fetch(`${API}/${id}`, {
                    method: "PATCH",
                    body: fileFormData
                });
            } else {
                // For forms without files, use JSON
                res = await fetch(`${API}/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }

            if (res.ok) {
                window.location.href = `/admin-static/${table}`;
            } else {
                msg.textContent = "Error: " + await res.text();
            }
        } catch {
            msg.textContent = "Server error.";
        }
    };

    (async () => {
        if (!table || !id) return;
        document.getElementById("formTitle").textContent =
            `Edit ${table.replace(/_/g, " ")}`;

        await loadRecord();   // Load data FIRST
        await buildForm();    // Then build form with loaded data
    })();

    async function openMediaGallery(fieldName) {
        const messageDiv = document.getElementById("formMessage");
        
        try {
            // Fetch all media
            const res = await fetch('/media'); 
            if (!res.ok) throw new Error("Could not load gallery");
            const images = await res.json();
            
            console.log("Loaded images:", images);

            // Create the Modal Overlay
            const modal = document.createElement('div');
            modal.id = "galleryModal";
            modal.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; display:flex; justify-content:center; align-items:center; padding:20px;";
            
            // Create the Gallery Container
            const content = document.createElement('div');
            content.style = "background:white; width:100%; max-width:900px; max-height:90vh; border-radius:12px; display:flex; flex-direction:column; overflow:hidden;";
            
            // Header
            const header = document.createElement('div');
            header.style = "padding:20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;";
            header.innerHTML = `
                <h3 style="margin:0;">Select Image for ${fieldName.replace(/_/g, ' ')}</h3>
                <button type="button" id="closeGallery" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            `;
            
            const grid = document.createElement('div');
            grid.id = "galleryGrid";
            grid.style = "padding:20px; display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:20px; overflow-y:auto; flex-grow:1;";

            // Check if images array exists and has items
            if (!images || images.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">No images found</p>';
            } else {
                images.forEach(img => {
                    const card = document.createElement('div');
                    card.className = "gallery-card";
                    card.style = "border:2px solid #eee; border-radius:8px; overflow:hidden; cursor:pointer; transition: transform 0.2s, border-color 0.2s;";
                    
                    // Get proper image path
                    let imagePath = img.Path || img.path || '';
                    if (imagePath.startsWith('../')) {
                        imagePath = imagePath.substring(2);
                    }
                    if (!imagePath.startsWith('/')) {
                        imagePath = '/' + imagePath;
                    }
                    
                    console.log("Image path:", imagePath);
                    
                    const imageBox = document.createElement('div');
                    imageBox.style = "width:100%; height:120px; background:#f8f9fa; display:flex; align-items:center; justify-content:center;";
                    
                    const imgElement = document.createElement('img');
                    imgElement.src = imagePath;
                    imgElement.style = "max-width:100%; max-height:100%; object-fit:contain;";
                    imgElement.onerror = function() {
                        this.style.display = 'none';
                        imageBox.innerHTML = '<span style="color:#999; font-size:12px;">No preview</span>';
                    };
                    
                    imageBox.appendChild(imgElement);
                    
                    const info = document.createElement('div');
                    info.style = "padding:10px; font-size:11px; color:#666; background:white; border-top:1px solid #eee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;";
                    info.textContent = img.Name || img.name || 'Untitled';
                    
                    card.appendChild(imageBox);
                    card.appendChild(info);

                    // Hover effects
                    card.addEventListener('mouseenter', () => {
                        card.style.borderColor = "#2c3e50";
                        card.style.transform = "scale(1.02)";
                    });
                    card.addEventListener('mouseleave', () => {
                        card.style.borderColor = "#eee";
                        card.style.transform = "scale(1)";
                    });

                    // Selection Logic
                    card.addEventListener('click', () => {
                        const mediaID = img.Media_ID || img.media_id || img.ID || img.id;
                        
                        // Update Hidden Input with the Media_ID
                        const hiddenInput = document.getElementById(`hidden_${fieldName}`);
                        hiddenInput.value = mediaID;
                        
                        // Clear the file upload input and remove required
                        const fileInput = document.getElementById(`file_${fieldName}`);
                        fileInput.value = "";
                        fileInput.removeAttribute('required');
                        
                        // Visual Feedback
                        updatePreview(fieldName, imagePath);
                        
                        // Close modal
                        document.body.removeChild(modal);
                    });
                    
                    grid.appendChild(card);
                });
            }

            content.appendChild(header);
            content.appendChild(grid);
            modal.appendChild(content);
            document.body.appendChild(modal);

            // Close logic
            header.querySelector('#closeGallery').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
            modal.addEventListener('click', (e) => {
                if(e.target === modal) {
                    document.body.removeChild(modal);
                }
            });

        } catch (err) {
            console.error("Gallery error:", err);
            messageDiv.textContent = "Error loading gallery: " + err.message;
        }
    }

    function updatePreview(fieldName, path) {
        let preview = document.getElementById(`preview_${fieldName}`);
        if (!preview) {
            preview = document.createElement('img');
            preview.id = `preview_${fieldName}`;
            preview.style = "height:40px; border-radius:4px; border:1px solid #ccc; margin-left:10px; display:block; margin-top:5px;";
            document.getElementById(`file_${fieldName}`).parentElement.appendChild(preview);
        }
        preview.src = path;
    }
</script>
