<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Navigation List</title>

    <link rel="stylesheet" href="/static/admin/style_sheets_css/style.css" id="main-style-link" />
    <link rel="stylesheet" href="/static/admin/style_sheets_css/style-preset.css" />

<style>
    body.pc-body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
    }

    .pc-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 260px;
        background: #2c3e50;
        z-index: 1025;
        overflow-y: auto;
    }

    .pc-container {
        width: 100%;
    }

    .pc-content {
        margin-left: 260px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px;
        box-sizing: border-box;
        width: calc(100% - 260px);
    }

    .page-wrapper {
        background: white;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 1200px;
        overflow: hidden;
    }

    .table-responsive {
        width: 100%;
        overflow-x: auto;
        margin-top: 20px;
        border: 1px solid #eee;
        border-radius: 4px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 900px;
    }

    th, td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
        white-space: nowrap;
    }

    th {
        background: #f8f9fa;
        font-weight: 600;
        color: #333;
    }

    tr:hover {
        background-color: #fcfcfc;
    }

    .edit-btn, .delete-btn {
        padding: 6px 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 13px;
    }
    .edit-btn { background: #e936e9; color: white; margin-right: 5px; }
    .delete-btn { background: #e74c3c; color: white; }
</style>
</head>

                </a>
            </div>
            <div class="navbar-content">
                <ul class="pc-navbar">
                    <li class="pc-item pc-caption">

                    </li>
                    <li class="pc-item">
                        <a href="/admin-static/administrators" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-house-line"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Administrator">Administrator</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/client" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-house-line"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Klient">Klient</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/navigation" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-house-line"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Nawigacja">Nawigacja</span>
                        </a>

                    <li class="pc-item">

                            </span>

                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/pages" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-truck"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Strony">Strony</span>
                        </a>
                    </li>

                    <li class="pc-item">
                        <a href="/admin-static/order" class="pc-link">
                            <span class="pc-micon">
                                <i class="ph ph-truck"></i>
                            </span>
                            <span class="pc-mtext" data-i18n="Strony">Zamówienia</span>

                    <li class="pc-item">
                        <a href="/admin-static/delivery_dictionary" class="pc-link">

                                <i class="ph ph-truck"></i>
                            </span>

                </ul>
            </div>
        </div>
    </nav>

    <div class="pc-content">
    <div class="page-wrapper">
        <h1>Edit Navigation Items</h1>

        <div class="table-responsive">
            <table border="1" cellpadding="8">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>URL</th>
                        <th>Position</th>
                        <th>Parent ID</th>
                        <th>Administrator</th>
                        <th>Created</th>
                        <th>Modified</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="navigationTableBody"></tbody>
            </table>
        </div>

        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
            <button id="addBtn"
                style="background: #27ae60; color: white; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
                + Add New Navigation Item
            </button>
        </div>
    </div>
</div>

<script>
    function formatDate(dateStr) {
        if (!dateStr) return "-";
        const date = new Date(dateStr);
        return isNaN(date.getTime()) ? dateStr : date.toLocaleString();
    }

    async function loadNavigation() {
        try {
            const res = await fetch("/navigation");
            if (!res.ok) throw new Error("Failed to load navigation");

            const data = await res.json();
            const tbody = document.getElementById("navigationTableBody");
            tbody.innerHTML = "";

            function addRow(item, parentId = "-") {
                const tr = document.createElement("tr");
                tr.innerHTML = `
            <td>${item.navigation_id}</td>
            <td>${item.name}</td>
            <td>${item.url ?? ""}</td>
            <td>${item.position ?? ""}</td>
            <td>${parentId}</td>
            <td>${item.administrator_id}</td>
            <td>${formatDate(item.create_date)}</td>
            <td>${formatDate(item.modify_date)}</td>
            <td>
                <button class="edit-btn" data-id="${item.navigation_id}">Edit</button>
                <button class="delete-btn" data-id="${item.navigation_id}">Delete</button>
            </td>
        `;

                tbody.appendChild(tr);

                tr.querySelector(".edit-btn").addEventListener("click", () => {
                    window.location.href = `/admin-static/edit?table=navigation&id=${item.navigation_id}`;
                });

                tr.querySelector(".delete-btn").addEventListener("click", async () => {
                    if (!confirm("Are you sure you want to delete this navigation item?")) return;
                    try {
                        const res = await fetch(`/navigation/${item.navigation_id}`, {
                            method: "DELETE",
                            headers: { "Content-Type": "application/json" }
                        });
                        if (!res.ok) throw new Error(await res.text());
                        tr.remove();
                    } catch (err) {
                        console.error("Delete failed:", err);
                        alert("Failed to delete navigation item");
                    }
                });

                if (Array.isArray(item.children) && item.children.length > 0) {
                    item.children.forEach(child => addRow(child, item.navigation_id));
                }
            }

            data.forEach(item => addRow(item));
        } catch (err) {
            console.error("Navigation load error:", err);
            alert("Failed to load navigation");
        }
    }

    window.addEventListener("DOMContentLoaded", loadNavigation);

    document.getElementById("addBtn").onclick = () => {
        window.location.href = "/admin-static/create";
    };
</script>

</body>

</html>
