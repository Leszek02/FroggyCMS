<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Register</title>
        <link rel="stylesheet" href="/static/bootstrap.min.css" type="text/css">
        <link rel="stylesheet" href="/static/font-awesome.min.css" type="text/css">
        <link rel="stylesheet" href="/static/style.css" type="text/css">
    </head>
    <body>
        <div id="preloder">
            <div class="loader"></div>
        </div>

        <div class="breadcrumb-option set-bg auth-breadcrumb" data-setbg="img/breadcrumb-bg.jpg">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <div class="breadcrumb__text">
                            <h2>Register</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="about spad auth-wrapper">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <div class="card auth-card">
                            <div class="card-body">

                                <form action="/register" method="post" novalidate>
                                    <div class="form-group">
                                        <label for="First_name" class="sr-only">First name</label>
                                        <input id="First_name" type="text" name="First_name" class="form-control"
                                            placeholder="First name" required autocomplete="First_name">
                                    </div>

                                    <div class="form-group">
                                        <label for="Last_name" class="sr-only">Last name</label>
                                        <input id="Last_name" type="text" name="Last_name" class="form-control"
                                            placeholder="Last name" required autocomplete="Last_name">
                                    </div>

                                    <div class="form-group">
                                        <label for="login" class="sr-only">Login</label>
                                        <input id="login" type="email" name="login" class="form-control"
                                            placeholder="Login" required autocomplete="login">
                                    </div>

                                    <div class="form-group">
                                        <label for="email" class="sr-only">Email</label>
                                        <input id="email" type="email" name="email" class="form-control"
                                            placeholder="Email" required autocomplete="email">
                                    </div>

                                    <div class="form-group">
                                        <label for="password" class="sr-only">Password</label>
                                        <input id="password" type="password" name="password" class="form-control"
                                            placeholder="Password" required autocomplete="new-password">
                                    </div>
                                    <div class="form-group">
                                        <label for="password_confirm" class="sr-only">Confirm Password</label>
                                        <input id="password_confirm" type="password" name="password_confirm" class="form-control"
                                            placeholder="Confirm Password" required autocomplete="new-password">
                                    </div>

                                    <div class="form-group text-center mb-0">
                                        <button type="submit" class="auth-btn">Register</button>
                                    </div>
                                </form>

                                <div class="text-center mt-3">
                                    <a href="/shop/main" class="auth-back-btn">Return to shop</a>
                                </div>

                                <p class="text-center auth-footer">Already have an account? <a class="auth-small-link" href="/login">Login</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <link rel="stylesheet" href="/static/auth.css" type="text/css">
        <script src="/static/jquery-3.3.1.min.js"></script>
        <script src="/static/bootstrap.min.js"></script>
        <script src="/static/main.js"></script>
    </body>
</html>
