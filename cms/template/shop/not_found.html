<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Page Not Found">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>404 - Page Not Found | Florist</title>

    <!-- Css Styles -->
    <link rel="stylesheet" href="/static/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/static/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/static/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/static/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/static/nice-select.css" type="text/css">
    <link rel="stylesheet" href="/static/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/static/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/static/style.css" type="text/css">
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <section class="error-section spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <div class="error-content">
                        <div class="error-code" style="font-size: 120px; font-weight: bold; margin-bottom: 20px;">
                            404
                        </div>
                        <h2 style="font-size: 36px; margin-bottom: 20px;">Page Not Found</h2>
                        <p style="font-size: 18px; color: #666; margin-bottom: 40px;">
                            Sorry, the page you're looking for doesn't exist or has been moved.
                        </p>
                        <div class="error-actions">
                            <a href="/shop/main" class="primary-btn" style="margin-right: 10px;">Go to Homepage</a>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Js Plugins -->
    <script src="/static/jquery-3.3.1.min.js"></script>
    <script src="/static/bootstrap.min.js"></script>
    <script src="/static/jquery.magnific-popup.min.js"></script>
    <script src="/static/mixitup.min.js"></script>
    <script src="/static/jquery.nice-select.min.js"></script>
    <script src="/static/jquery.nicescroll.min.js"></script>
    <script src="/static/jquery.slicknav.js"></script>
    <script src="/static/owl.carousel.min.js"></script>
    <script src="/static/main.js"></script>
</body>

</html>
