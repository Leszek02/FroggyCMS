
services:
  db:
    image: database
    container_name: froggycms-database
    build:
      dockerfile: ./Dockerfile
      context: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
    - db-data:/var/lib/postgresql
    ports:
    - "5433:5432"
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 3s
      retries: 10


  cms:
    image: main-cms-image
    build:
      dockerfile: ./Dockerfile
      context: cms
    ports:
    - "8080:8080"
    environment:
      DB_HOST: froggycms-database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  db-data: